<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 300" font-family="Helvetica, Arial, sans-serif">
  <title>How choose.py works: the chat runs choose.py, which serves a page in your browser and prints your answer back</title>
  <defs><marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#8b96a5"/></marker></defs>
  <rect x="6" y="20" width="708" height="260" rx="10" fill="none" stroke="#8b96a5" stroke-dasharray="6 6"/>
  <text x="22" y="44" font-size="13" fill="#8b96a5" letter-spacing="1">YOUR MACHINE</text>
  <rect x="20" y="110" width="150" height="80" rx="8" fill="#8b96a5" fill-opacity=".14" stroke="#8b96a5"/>
  <text x="95" y="146" font-size="17" font-weight="600" fill="#8b96a5" text-anchor="middle">LLM chat</text>
  <text x="95" y="168" font-size="13" fill="#8b96a5" text-anchor="middle">the agent</text>
  <rect x="270" y="110" width="170" height="80" rx="8" fill="#8b96a5" fill-opacity=".14" stroke="#8b96a5"/>
  <text x="355" y="146" font-size="17" font-weight="600" fill="#8b96a5" text-anchor="middle">choose.py</text>
  <text x="355" y="168" font-size="13" fill="#8b96a5" text-anchor="middle">small web server</text>
  <rect x="510" y="110" width="170" height="80" rx="8" fill="#8b96a5" fill-opacity=".14" stroke="#8b96a5"/>
  <text x="595" y="146" font-size="17" font-weight="600" fill="#8b96a5" text-anchor="middle">Browser</text>
  <text x="595" y="168" font-size="13" fill="#8b96a5" text-anchor="middle">the question page</text>
  <path d="M170 132H262" stroke="#8b96a5" stroke-width="2" marker-end="url(#a)"/>
  <text x="216" y="122" font-size="12" fill="#8b96a5" text-anchor="middle">runs it</text>
  <path d="M440 132H502" stroke="#8b96a5" stroke-width="2" marker-end="url(#a)"/>
  <text x="475" y="122" font-size="12" fill="#8b96a5" text-anchor="middle">opens</text>
  <path d="M510 170H448" stroke="#8b96a5" stroke-width="2" marker-end="url(#a)"/>
  <text x="479" y="188" font-size="12" fill="#8b96a5" text-anchor="middle">your click</text>
  <path d="M270 170H178" stroke="#8b96a5" stroke-width="2" marker-end="url(#a)"/>
  <text x="224" y="188" font-size="12" fill="#8b96a5" text-anchor="middle">prints answer</text>
  <text x="360" y="250" font-size="13" fill="#8b96a5" text-anchor="middle">No cloud service: choose.py listens on 127.0.0.1 only</text>
</svg>
